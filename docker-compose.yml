# Optional PostgreSQL for the DATABASE_URL smoke test and migration round-trip.
#   docker compose up -d db
#   PUBLICSAFE_TEST_PG_URL=postgresql+psycopg://publicsafe:publicsafe@127.0.0.1:55432/publicsafe make test
# Host port 55432 avoids clashing with a locally installed PostgreSQL on 5432.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: publicsafe
      POSTGRES_PASSWORD: publicsafe
      POSTGRES_DB: publicsafe
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U publicsafe"]
      interval: 2s
      timeout: 2s
      retries: 15
